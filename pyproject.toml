# Sleeper Cell — modern Python project metadata.
# This is the source of truth for dependencies. `uv` reads it directly.
# A parallel `requirements.txt` exists for users without uv (plain pip workflows).

[project]
name = "sleepercell"
version = "0.1.0"
description = "Live dynasty draft intelligence dashboard for Sleeper fantasy football"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# 3.14 is excluded on purpose: as of May 2026 Homebrew's 3.14 build has a libexpat
# symbol mismatch on macOS that breaks pip and any module importing xml.parsers.expat.
# uv will refuse to use 3.14 here and pick a working interpreter (3.12 or 3.13) instead.
license = { text = "MIT" }
authors = [{ name = "Ian Mackenzie" }]
keywords = ["fantasy-football", "sleeper", "dynasty", "streamlit", "draft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "streamlit>=1.40,<2.0",
    "streamlit-autorefresh>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.7,<3.0",
    "rapidfuzz>=3.9,<4.0",
    "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
]

[tool.uv]
# uv-specific knobs go here. We don't pin a single Python build — uv will pick the
# best available within the requires-python range, downloading one if needed.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Build system declaration: we don't actually publish this to PyPI (yet), but having
# a valid [build-system] block keeps modern tooling happy and leaves the door open.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
